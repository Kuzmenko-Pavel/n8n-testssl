name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify:vendor
      - run: npm run fix:vendor-perms
      - run: vendor/testssl/testssl.sh --version
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: npm run smoke:pack
